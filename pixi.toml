[workspace]
name = "mncm"
version = "0.1.0"
description = "Next-Concept Modeling: Fast, Parallel Coarse-to-Fine Text Generation"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.12,<3.13"
pyyaml = ">=6.0"
numpy = ">=1.26"
tqdm = ">=4.66"
pip = ">=24.0"
ipykernel = ">=6.29"

[pypi-dependencies]
huggingface-hub = ">=0.24.0"
transformers = ">=4.51,<5"
datasets = ">=2.18.0"
einops = ">=0.7.0"
rouge-score = ">=0.1.2"
sacrebleu = ">=2.4.0"
nltk = ">=3.8.1"
scipy = ">=1.12.0"
omegaconf = ">=2.3.0"
hydra-core = ">=1.3.0"
regex = ">=2024.0"

# --- CPU Feature (default) ---
[feature.cpu.dependencies]
pytorch = ">=2.2.0"
cpuonly = "*"

# --- GPU Feature ---
# Uncomment and set `default = { features = ["cuda"] }` below to use CUDA.
#[feature.cuda.system-requirements]
#cuda = "12.1"
#
#[feature.cuda.dependencies]
#pytorch = ">=2.2.0"
#pytorch-cuda = "12.1.*"

[environments]
default = { features = ["cpu"], solve-group = "default" }
cpu = { features = ["cpu"], solve-group = "default" }

[tasks]
install-reqs = "pip install --no-deps -r requirements.txt"
download-checkpoints = "huggingface-cli download hazyresearch/ncm-checkpoints --local-dir artifacts"
download-datasets = "huggingface-cli download hazyresearch/ncm-datasets --repo-type dataset --local-dir data"
download-all = { depends-on = ["download-checkpoints", "download-datasets"] }

# Run evaluation on CPU (usage: pixi run -e cpu eval-cpu xsum)
[tasks.eval-cpu]
args = ["task"]
cmd = "python evaluate.py --config config/eval/{{ task }}.yaml --checkpoint-dir artifacts/{{ task }} --data-dir data/{{ task }}"
